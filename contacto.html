    <main>
        <h2>Contactanos</h2>
        <form> 
            <label for="Nombre"> Nombre y Apellido </label><br>
            <input type="text" id="Nombre" name="Nombre" placeholder="Tu nombre completo"><br>
            <label for="Telefono"> Teléfono </label><br>
            <input type="tel" id="Telefono" name="Telefono" placeholder="Tu número de teléfono"><br>
            <label for="email">Ingresa tu email </label><br>
            <input type="email" id="email" name="email" placeholder="Tu dirección de email" required><br>
            <label for="motivo"> Motivo de contacto </label><br>
            <select id="motivo" name="motivo">
                <option value="consulta">Consulta</option>
                <option value="sugerencia">Sugerencia</option>
                <option value="reclamo">Reclamo</option>
            </select> 
            <br>
            <br>
            <textarea id="mensaje" name="Escribe tu mensaje" rows="6" cols="20" maxlength="200"></textarea>   
            <br>
            <input type="checkbox" id="novedades" name="novedades">
            <label for="novedades">Quiero recibir las novedades del vivero</label>
            <br>
            <br>
            <input type="submit" value="Enviar"> <input type="reset" value="Limpiar">
            <br>
    
        </form>

    </main>
